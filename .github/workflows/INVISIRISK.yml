permissions:
  checks: write
  contents: write
  packages: read
  actions: write
name: JS

on:
  workflow_dispatch:


jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build Angular Project and Run PSE

    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup PSE
      - name: Setup PSE
        uses: invisirisk/pse-action@develop
        with:
          api_url: "https://app.dev.invisirisk.com"
          app_token: ${{ secrets.IR_API_KEY_TET }}

      # Setup Node.js
      - name: Use Node.js
        uses: actions/setup-node@v3
  

  

      # Install project dependencies
      - name: Install dependencies
        run: yarn install

      # Cleanup PSE
      - name: Cleanup PSE
        if: always()
        uses: invisirisk/pse-action@develop
        with:
          cleanup: "true"

  gather_analytics:
   runs-on: ubuntu-latest
   name: Gather Analytics
   needs: build-and-deploy
   if: always()
   steps:
   - name: Gather Status
     uses: invisirisk/pse-action@develop
     with:
      api_url: "https://app.dev.invisirisk.com"
      app_token: ${{ secrets.IR_API_KEY_TET }}
      send_job_status: "true"
      debug: "true"
